<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account - Dream Travel Planner</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script>
      if (localStorage.getItem("darkMode") === "enabled") {
        document.documentElement.classList.add("dark-mode");
      }
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-top">
        <a href="../index.html" class="brand">
          <img
            src="../images/logo.png"
            alt="Dream Travel Planner Logo"
            class="site-logo"
          />
          <h1>Dream Travel Planner</h1>
        </a>
      </div>
      <div class="profile-icon-container">
        <a href="profile.html" class="profile-icon-link">
          <img
            src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
            alt="Profile"
            class="profile-icon"
          />
        </a>
      </div>
      <p>Create your travel account</p>
    </header>

    <main class="auth-main">
      <section class="auth-card">
        <h2>Create Account</h2>
        <p>Create your travel account</p>

        <form id="createAccountForm" class="auth-form">
          <label for="firstName">First Name</label>

          <input
            type="text"
            id="firstName"
            name="firstName"
            required
            maxlength="50"
            pattern="^[A-Za-z\s]+$"
            title="First name should contain letters only"
            oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')"
          />

          <label for="lastName">Last Name</label>
          <input
            type="text"
            id="lastName"
            name="lastName"
            required
            maxlength="50"
            pattern="^[A-Za-z\s]+$"
            title="Last name should contain letters only"
            oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')"
          />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />

          <label for="mobile">Mobile Number</label>
          <input
            type="tel"
            id="mobile"
            name="mobile"
            required
            pattern="[0-9]{10}"
            placeholder="05xxxxxxxx"
          />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            minlength="6"
          />

          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            required
            minlength="6"
          />

          <p id="accountMessage" class="form-message"></p>

          <button type="submit">Create Account</button>
        </form>

        <p class="auth-link">
          Already have an account?
          <a href="login.html">Login here</a>
        </p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Dream Travel Planner. All rights reserved.</p>
    </footer>

    <script src="../js/account.js"></script>
    <script src="../js/dark-mode.js"></script>
    <script src="../js/profile-icon.js"></script>
  </body>
</html>
