<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome - Dream Travel Planner</title>

    <link rel="stylesheet" href="../css/style.css">

    <script>
      if (localStorage.getItem("darkMode") === "enabled") {
        document.documentElement.classList.add("dark-mode");
      }
    </script>
  </head>

  <body>
    <main class="welcome-main">
      <img
        src="../images/logo.png"
        alt="Dream Travel Planner Background Logo"
        class="welcome-bg-logo"
      >

      <div class="welcome-card">
        <div class="welcome-logo-circle">
          <img
            src="../images/logo.png"
            alt="Dream Travel Planner"
            class="welcome-logo"
          >
        </div>

        <h1>Dream Travel Planner</h1>

        <p class="welcome-text">
          Plan smarter, travel better, and turn your dream destination into a real journey.
        </p>

        <a href="login.html" class="welcome-login-btn">
          Login
        </a>

        <p class="welcome-account-text">
          Don’t have an account?
          <a href="create-account.html">Create Account</a>
        </p>
      </div>
    </main>
  </body>
</html>
