<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Dream Travel Planner</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="header-top">
            <a href="../index.html" class="brand">
                <img src="../images/logo.png" alt="Dream Travel Planner Logo" class="site-logo">
                <h1>Dream Travel Planner</h1>
            </a>
        </div>
        <p>Contact Our Team</p>
    </header>

    <nav class="navigation">
        <ul>
            <li class="list">
                <a href="../index.html">
                    <span class="icon">
                        <ion-icon name="home-outline"></ion-icon>
                    </span>
                    <span class="text">Home</span>
                </a>
            </li>

            <li class="list">
                <a href="about-us.html">
                    <span class="icon">
                        <ion-icon name="people-outline"></ion-icon>
                    </span>
                    <span class="text">About</span>
                </a>
            </li>

            <li class="list active">
                <a href="contact-us.html">
                    <span class="icon">
                        <ion-icon name="call-outline"></ion-icon>
                    </span>
                    <span class="text">Contact</span>
                </a>
            </li>

            <li class="list">
                <a href="trip-request.html">
                    <span class="icon">
                        <ion-icon name="airplane-outline"></ion-icon>
                    </span>
                    <span class="text">Plan Trip</span>
                </a>
            </li>

            <div class="indicator"></div>
        </ul>
    </nav>

    <main>
        <section class="contact-section">
            <h2>Contact Us</h2>
            <p class="contact-text">
                If you have any questions, suggestions, or travel inquiries, please fill out the form below.
                We would be happy to hear from you.
            </p>

            <form class="contact-form" action="#" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" id="first-name" name="first-name" placeholder="Enter your first name"
                            pattern="^[A-Za-z\s]+$"
                            title="First name should contain letters only"
                            required
                            oninput="this.value = this.value.replace(/[^A-Za-z\s]/g,'')">
                    </div>

                    <div class="form-group">
                        <input type="text" id="last-name" name="last-name" placeholder="Enter your last name"
                            pattern="^[A-Za-z\s]+$"
                            title="Last name should contain letters only"
                            required
                            oninput="this.value = this.value.replace(/[^A-Za-z\s]/g,'')">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="mobile">Mobile Number</label>
                        <input type="tel" id="mobile" name="mobile"
                            placeholder="05XXXXXXXX"
                            required
                            pattern="^05[0-9]{8}$"
                            maxlength="10"
                            title="Mobile number must start with 05 and contain exactly 10 digits"
                            oninput="this.value = this.value.replace(/[^0-9]/g,'')">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group full-width">
                        <label for="language">Language of Communication</label>
                        <select id="language" name="language" required>
                            <option value="">Select a language</option>
                            <option value="arabic">Arabic</option>
                            <option value="english">English</option>
                            <option value="french">French</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group full-width">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea>
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit">Send Message</button>
                    <button type="reset" class="reset-btn">Reset</button>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Dream Travel Planner. All rights reserved.</p>
    </footer>

    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    <script src="../js/contact-validation.js"></script>

</body>
</html>
