<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Dream Travel Planner</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script>
      if (localStorage.getItem("darkMode") === "enabled") {
        document.documentElement.classList.add("dark-mode");
      }
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-top">
        <a href="../index.html" class="brand">
          <img
            src="../images/logo.png"
            alt="Dream Travel Planner Logo"
            class="site-logo"
          />
          <h1>Dream Travel Planner</h1>
        </a>
      </div>
      <div class="profile-icon-container">
        <a href="profile.html" class="profile-icon-link">
          <img
            src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
            alt="Profile"
            class="profile-icon"
          />
        </a>
      </div>
      <p>Login to your account</p>
    </header>

    <main class="auth-main">
      <section class="auth-card login-card">
        <h2>Login</h2>
        <p>Login to your account</p>

        <form id="loginForm" class="auth-form">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" name="email" required />

          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            name="password"
            required
            minlength="6"
          />

          <p id="loginMessage" class="form-message"></p>

          <button type="submit">Login</button>
        </form>

        <p class="auth-link">
          Don't have an account?
          <a href="create-account.html">Create Account</a>
        </p>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Dream Travel Planner. All rights reserved.</p>
    </footer>

    <script src="../js/account.js"></script>
    <script src="../js/profile-icon.js"></script>
  </body>
</html>
