<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Results - Dream Travel Planner</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <a href="../index.html" class="brand">
      <img src="../images/logo.png" alt="Dream Travel Planner Logo" class="site-logo">
      <h1>Dream Travel Planner</h1>
    </a>
  </div>
  <p>Your Recommended Travel Plans</p>
</header>

<nav class="navigation">
  <ul>
    <li class="list"><a href="../index.html"><span class="icon"><ion-icon name="home-outline"></ion-icon></span><span class="text">Home</span></a></li>
    <li class="list"><a href="about-us.html"><span class="icon"><ion-icon name="people-outline"></ion-icon></span><span class="text">About</span></a></li>
    <li class="list"><a href="contact-us.html"><span class="icon"><ion-icon name="call-outline"></ion-icon></span><span class="text">Contact</span></a></li>
    <li class="list active"><a href="trip-request.html"><span class="icon"><ion-icon name="airplane-outline"></ion-icon></span><span class="text">Plan Trip</span></a></li>
    <div class="indicator"></div>
  </ul>
</nav>

<main>
  <section class="results-section">
    <h2>Recommended Destinations</h2>
    <p class="results-text" id="summaryText"></p>

    <div class="results-grid" id="recommendations"></div>
  </section>
</main>

<script>
const params = new URLSearchParams(window.location.search);

const budget = Number(params.get("budget"));
const days = Number(params.get("days"));
const traveltype = (params.get("traveltype") || "").toLowerCase();
const hotel = params.get("hotel") || "Hotel";

document.getElementById("summaryText").innerText =
  `Based on your input: ${budget} budget, ${days} days, ${traveltype || "general"} trip, and ${hotel} stay.`;

let plans = [];

if (budget <= 3000 && days <= 4) {
  plans = [
    {
      country: "Dubai",
      image: "dubai.jpg",
      type: traveltype || "Short / Relaxing",
      duration: `${days} Days`,
      budget: `Fits your budget of ${budget}`,
      description: `A short and affordable trip that matches your ${hotel} stay preference.`
    },
    {
      country: "Georgia",
      image: "georgia.jpg",
      type: traveltype || "Nature / Budget",
      duration: `${days} Days`,
      budget: "Low budget friendly",
      description: "A simple nearby destination with relaxing activities and low travel cost."
    },
    {
      country: "Malaysia",
      image: "malaysia.jpg",
      type: traveltype || "Family / Relaxing",
      duration: `${days} Days`,
      budget: "Affordable option",
      description: "A practical choice for a short trip with comfortable accommodation."
    }
  ];
} else if (budget <= 5000) {
  plans = [
    {
      country: "Malaysia",
      image: "malaysia.jpg",
      type: traveltype || "Family / Adventure",
      duration: `${days} Days`,
      budget: `Suitable for your budget of ${budget}`,
      description: `A budget-friendly destination with activities that can match a ${traveltype || "general"} trip.`
    },
    {
      country: "Georgia",
      image: "georgia.jpg",
      type: traveltype || "Culture / Nature",
      duration: `${days} Days`,
      budget: "Budget-friendly",
      description: "A beautiful and affordable destination with nature, culture, and good value."
    },
    {
      country: "Turkey",
      image: "turkey.jpg",
      type: traveltype || "Culture / Relaxing",
      duration: `${days} Days`,
      budget: "Suitable for low to medium budgets",
      description: "A good option for travelers who want a comfortable trip without high cost."
    }
  ];
} else if (budget <= 10000) {
  plans = [
    {
      country: "Turkey",
      image: "turkey.jpg",
      type: traveltype || "Adventure / Culture",
      duration: `${days} Days`,
      budget: `Suitable for your budget of ${budget}`,
      description: "A balanced destination with culture, shopping, views, and reasonable costs."
    },
    {
      country: "Malaysia",
      image: "malaysia.jpg",
      type: traveltype || "Adventure / Relaxing",
      duration: `${days} Days`,
      budget: "Medium budget friendly",
      description: "A flexible destination with beaches, activities, and many hotel options."
    },
    {
      country: "Dubai",
      image: "dubai.jpg",
      type: traveltype || "Luxury / Shopping",
      duration: `${days} Days`,
      budget: "Medium to high budget",
      description: "A modern destination suitable for short trips, shopping, and comfortable stays."
    }
  ];
} else {
  plans = [
    {
      country: "Italy",
      image: "italy.jpg",
      type: traveltype || "Luxury / Romantic",
      duration: `${days} Days`,
      budget: `Suitable for your budget of ${budget}`,
      description: "A premium destination with history, elegance, romance, and luxury experiences."
    },
    {
      country: "Dubai",
      image: "dubai.jpg",
      type: traveltype || "Luxury / Modern",
      duration: `${days} Days`,
      budget: "High budget option",
      description: "A luxury destination with modern attractions, shopping, and premium hotels."
    },
    {
      country: "Turkey",
      image: "turkey.jpg",
      type: traveltype || "Romantic / Culture",
      duration: `${days} Days`,
      budget: "High comfort option",
      description: "A comfortable destination with culture, views, and memorable experiences."
    }
  ];
}

const container = document.getElementById("recommendations");

container.innerHTML = plans.map(plan => `
  <article class="result-card">
    <img src="../images/${plan.image}" alt="${plan.country}" class="card-img">
    <h3>${plan.country}</h3>
    <p><strong>Travel Type:</strong> ${plan.type}</p>
    <p><strong>Suggested Duration:</strong> ${plan.duration}</p>
    <p><strong>Estimated Budget:</strong> ${plan.budget}</p>
    <p><strong>Preferred Stay:</strong> ${hotel}</p>
    <p>${plan.description}</p>
    <a href="plan-confirmation.html" class="plan-btn">Select This Plan</a>
  </article>
`).join("");
</script>

<footer>
  <p>&copy; 2026 Dream Travel Planner. All rights reserved.</p>
</footer>

<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons/ionicons.js"></script>

</body>
</html>
